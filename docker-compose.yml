# Run the DAWLab Hub locally or on any VPS:
#   HUB_CREATE_KEY=change-me docker compose up -d
services:
  hub:
    build: .
    ports:
      - "8080:8080"
    environment:
      HUB_CREATE_KEY: ${HUB_CREATE_KEY:?set HUB_CREATE_KEY}
      # PUBLIC_URL: https://hub.example.com   # if behind a proxy that rewrites Host
      # S3_BUCKET / S3_ENDPOINT / S3_REGION / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY to use a bucket instead of the volume
    volumes:
      - hub-data:/data
    restart: unless-stopped
volumes:
  hub-data:
