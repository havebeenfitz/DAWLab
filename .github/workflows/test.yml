name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - run: npx tsc --noEmit -p tsconfig.json

      - run: npx vitest run
