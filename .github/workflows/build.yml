name: Release

# Push a tag like v1.5.2 (matching "version" in package.json) and this builds
# the macOS DMGs and publishes the GitHub release with them. Run it by hand
# (Actions > Release > Run workflow) to build the DMGs without releasing.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($want)."
            exit 1
          fi

      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - run: npx vitest run

  build:
    name: macOS ${{ matrix.arch }}
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - run: npm run build:renderer

      # Signing + notarization kick in when these repository secrets exist:
      #   MAC_CERTS            base64 of the "Developer ID Application" .p12
      #   MAC_CERTS_PASSWORD   its export password
      #   APPLE_API_KEY_P8     contents of the App Store Connect API key (.p8)
      #   APPLE_API_KEY_ID     the key's ID
      #   APPLE_API_ISSUER     the issuer ID shown above the keys list
      # Without them the DMG gets an ad-hoc signature (not notarized).
      - name: Build the DMG
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CERTS" ]; then
            export CSC_LINK="$MAC_CERTS" CSC_KEY_PASSWORD="$MAC_CERTS_PASSWORD"
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run pack -- --mac --${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: DAWLab-mac-${{ matrix.arch }}
          path: release/**/*-Installer.dmg
          retention-days: 3
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: DAWLab ${{ github.ref_name }}
          files: artifacts/**/*-Installer.dmg
          draft: false
          make_latest: true
          generate_release_notes: true
          body: |
            Download the DMG for your Mac: arm64 for Apple Silicon (M1 and newer), x64 for Intel.

            Not notarized. After installing run:
            ```
            xattr -dr com.apple.quarantine /Applications/DAWLab.app && codesign --force --deep --sign - /Applications/DAWLab.app
            ```
